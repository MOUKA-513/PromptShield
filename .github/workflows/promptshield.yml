name: PromptShield Security

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PromptShield
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Security scan
        run: promptshield scan . --format sarif --output promptshield.sarif --fail-on HIGH

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: promptshield.sarif
